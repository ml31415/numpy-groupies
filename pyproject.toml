[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-groupies"
description = "Optimised tools for group-indexing operations: aggregated sum and more."
dynamic = ["version"]
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Michael Löffler", email = "ml@occam.com.ua"},
    {name = "Daniel Manson", email = "danielmanson.uk@gmail.com"}
]
maintainers = [
    {name = "Deepak Cherian", email = "dcherian@ucar.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
keywords = ["accumarray", "aggregate", "groupby", "grouping", "indexing"]
requires-python = ">=3.10" # 0.15 will raise this to ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
fast = [
    "numba",
]
dev = [
    "pytest",
    "pytest-xdist",
    "numba",
    "pandas",
    "numbagg",
    # pre-commit 4 requires Python >= 3.11, but the project still supports
    # 3.10, so stay on the 3.x line.
    "mypy>=2.4",
    "pre-commit>=3.8,<4",
    "ruff>=0.17",
]

[project.urls]
source = "https://github.com/ml31415/numpy-groupies"
tracker = "https://github.com/ml31415/numpy-groupies/issues"

[tool.mypy]
files = ["numpy_groupies"]
exclude = '(^|/)(tests|benchmarks)/'
extra_checks = true
warn_unused_ignores = true
warn_return_any = true
# the package is annotated in full and the annotation debt is paid off -
# every def needs annotations
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["setuptools_scm", "setuptools_scm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
# rumdl owns the markdown layout (hand-aligned example output), so ruff
# stays out of it. The pre-commit hooks mirror this with their own
# `exclude: \.md$` for ruff-format.
extend-exclude = ["*.md"]

[tool.coverage.run]
omit = ["numpy_groupies/benchmarks/*"]

[tool.pytest.ini_options]
# the suite is dominated by numba compilation, which splits across processes
# -n 0 runs single tests in the controlling process again (pdb, -s)
addopts = "-n auto"

[tool.ruff.lint]
# relative imports are not used anywhere in the package
extend-select = ["TID252"]
ignore = [
    "B008", # np.dtype defaults in signatures are immutable singletons
    "PLR0124", # val != val is the idiomatic NaN check
]

[tool.setuptools.packages.find]
include = ["numpy_groupies*"]

[tool.setuptools.package-data]
numpy_groupies = ["py.typed"]

[tool.setuptools_scm]
write_to = "numpy_groupies/_version.py"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"numpy_groupies/benchmarks/*" = ["B023"] # closures are invoked immediately within the loop

[tool.codespell]
ignore-words-list = "nd,"
ignore-regex = ".*codespell-ignore$"

[tool.rumdl]
disable = ["MD013"]
respect-gitignore = true
