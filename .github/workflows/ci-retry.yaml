name: CI retry
# The runners of the hosted service are stopped from time to time - the job
# of a version that is still compiling or testing then dies with a shutdown
# signal, and the run stands red for the rest of the hour until somebody
# presses the button.  The retry of the failed jobs brings the run back to
# green by itself: the shutdown of a runner is an event of the service, not
# of the code, and the next runner is very likely to live.
#
# A run whose runner is gone can also hang: the job never finishes, and the
# run never ends - so the retry of the failed jobs above never comes to it,
# since that needs a finished run.  The second job gives such a run a new
# start: it cancels the run and starts the jobs that did not succeed again.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # every quarter of an hour, so that a run that hangs is restarted within
    # the half hour that follows
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  retry:
    # only a run that failed, and only its first attempt: the retry of a
    # failed run must not trigger another retry
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retry the failed jobs
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.re-runFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            })

  restart:
    # every run of the CI that runs longer than half an hour - the schedule
    # brings the job to a run that hangs, the dispatch lets it be tried by
    # hand
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Restart the runs that run too long
        uses: actions/github-script@v8
        with:
          script: |
            // the bound of a run: the slowest job that succeeded took less
            // than twenty minutes, and a job that runs longer has lost its
            // runner to the shutdown of the service
            const limit = 30
            const { owner, repo } = context.repo
            const runs = []
            for (const status of ['in_progress', 'queued']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yaml',
                status,
                per_page: 50,
              })
              runs.push(...data.workflow_runs)
            }
            for (const run of runs) {
              const started = new Date(run.run_started_at || run.created_at)
              const minutes = (Date.now() - started.getTime()) / 60000
              if (minutes < limit) {
                continue
              }
              core.info(`run ${run.id} of ${run.head_branch} runs for ${minutes.toFixed(1)} minutes - restarting it`)
              // a run that is still running cannot be started again - the api
              // refuses it with "This workflow is already running" - so it is
              // cancelled first, and only the jobs that did not succeed are
              // started again
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id })
              // the cancel is a request: the run needs a moment to end
              for (let i = 0; i < 15; i++) {
                const { data: after } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })
                if (after.status === 'completed') {
                  break
                }
                await new Promise((resolve) => setTimeout(resolve, 20000))
              }
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id })
              } catch (error) {
                // a run that did not end in time keeps its place - the next
                // round of the schedule tries again
                core.warning(`run ${run.id} could not be started again: ${error.message}`)
              }
            }
